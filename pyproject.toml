[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rialo-devkit"
version = "0.1.0"
description = "Developer tools and local SCALE simulation for Rialo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["rich>=13.7,<15"]

[project.optional-dependencies]
sdk = ["rialo-cdk==0.1.0"]

[project.scripts]
rialo = "cli.rialo_cli:main"

[tool.setuptools.packages.find]
include = ["cli*"]
